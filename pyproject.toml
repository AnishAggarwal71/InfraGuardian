[project]
name = "infra-guardian"
version = "0.1.0"
description = "Agentic infrastructure observability and incident-response system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "psutil>=6.0",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Pin the package index to public PyPI at the project level so this repo resolves/builds the
# same way outside this machine's global uv config, which otherwise defaults to an internal
# Artifactory mirror (~/.config/uv/uv.toml) that isn't reachable from outside that network.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
